services:
  mysql:
    container_name: mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - hmp

volumes:
  mysql_data:

networks:
  hmp:
    driver: bridge