server:
  port: 9500
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ================================
            # HOTEL SERVICE
            # ================================
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/hotels/**

            # ================================
            # ROOM SERVICE
            # ================================
            - id: room-service
              uri: lb://room-service
              predicates:
                - Path=/api/v1/rooms/**

            # ================================
            # BOOKING SERVICE
            # ================================
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
